<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 송금 페이지</title>
    <style>
        /* CSS: 웹사이트 디자인 (깔끔한 토스 스타일) */
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7fa;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 5px; }
        .account-info { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        input {
            width: 80%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: right;
            font-size: 1.1rem;
            font-weight: bold;
        }
        button {
            width: 90%;
            padding: 14px;
            background-color: #0064ff;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #0051cc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>💸 송금하기</h1>
        <!-- 친구들이 안심할 수 있게 내 계좌 정보를 텍스트로 띄워줍니다 -->
        <div class="account-info">국민은행 123456-78-901234</div>
        
        <input type="number" id="amount" placeholder="금액 입력" value="1000">
        <button onclick="sendMoney()">토스 앱으로 보내기</button>
    </div>

    <!-- JavaScript: 계좌번호 연동 기능 -->
    <script>
        function sendMoney() {
    // 1. 입력한 금액 가져오기
    const amount = document.getElementById('amount').value;
    
    // 2. ⚠️ 내 정보 입력 (은행 코드와 계좌번호)
    // 은행 코드는 아래 목록을 보고 알맞게 적어주세요. (예: 신한은 shinhan, 국민은 kookmin)
    const bankCode = "toss"; 
    const accountNo = "190885796539"; // 하이픈(-) 없이 숫자만

    // 3. 토스 공식 웹 송금 주소 형식으로 조립
    const url = `https://toss.im/_m/transfer?bank=${bankCode}&account=${accountNo}&amount=${amount}`;

    if (amount > 0) {
        location.href = url;
    } else {
        alert("금액을 정확히 입력해주세요!");
    }
}
    </script>
